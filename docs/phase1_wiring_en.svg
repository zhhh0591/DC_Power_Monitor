    <text x="850" y="662" text-anchor="middle" font-size="12" fill="#e5e7eb">Battery Pack (AA cells in series)</text>
    <rect x="772" y="546" width="16" height="14" fill="#222222"/>
    <rect x="932" y="546" width="16" height="14" fill="#d92626"/>
