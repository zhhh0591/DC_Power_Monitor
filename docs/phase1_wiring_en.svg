  <text x="836" y="298" text-anchor="end" font-size="11" fill="#d92626">red +</text>
  <text x="836" y="372" text-anchor="end" font-size="11" fill="#222222">black −</text>
  <g>
    <rect x="60" y="140" width="180" height="320" rx="10" fill="#2f3640" stroke="#1e242b" stroke-width="2"/>
