  <rect x="0" y="0" width="1160" height="460" fill="#ffffff"/>
  <text x="580" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Phase 2 · Data Flow Diagram</text>
  <text x="580" y="64" text-anchor="middle" font-size="13" fill="#6b7280">INA219 sampling → ESP32 (WiFi/MQTT) → cloud broker → web dashboard  (no new hardware)</text>
  <line x1="256" y1="235" x2="330" y2="235" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/>
  <text x="296" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">I2C read</text>
