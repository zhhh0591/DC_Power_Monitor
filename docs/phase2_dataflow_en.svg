  <text x="1015" y="345" text-anchor="middle" font-size="12" fill="#374151">Web Dashboard (live charts / alerts)</text>
  <text x="580" y="420" text-anchor="middle" font-size="12" fill="#6b7280">Phase 2 adds only software and cloud components; the wiring is identical to Phase 1.</text>
