  <line x1="536" y1="235" x2="600" y2="235" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/>
  <text x="570" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">WiFi · MQTT</text>
  <text x="570" y="216" text-anchor="middle" font-size="11" fill="#374151">publish JSON</text>
  <text x="570" y="260" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#6b7280">publish</text>
  <line x1="842" y1="235" x2="910" y2="235" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/>
  <text x="877" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">WebSocket</text>
